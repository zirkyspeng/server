name: Prepare Marantz stable test branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stable test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/music-assistant/server.git refs/tags/2.10.1:refs/tags/2.10.1
          git checkout -b fix/marantz-dlna-next-duration-stable 2.10.1
          git cherry-pick a919e95 3fdcd9f f86b6e5 14ff09d
          git push origin fix/marantz-dlna-next-duration-stable
